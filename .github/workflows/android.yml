name: build-apk

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接用 runner 自带的 Android SDK，避免三方 action 初始化失败
      - name: Install SDK platform and build tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK root: $SDK_ROOT"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n1)"
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-30" "build-tools;33.0.1" "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jdck-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # 把 APK 发到 Release，手机和电脑都能直接下载，不用登录 Actions
      - name: Publish APK to Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "jdck $TAG" --notes "CI 自动构建，含后台自动登录"
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk#jdck-$VERSION.apk --clobber
